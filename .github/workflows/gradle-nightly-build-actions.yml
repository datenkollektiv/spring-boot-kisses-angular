name: Java CI Nightly Build
on:
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC

# Default to the least privilege; the job below overrides to `contents: write`
# only because GitHub Releases (used by djnicholson/release-action) live
# under the `contents` scope.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # required to publish the nightly GitHub Release
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      # https://github.com/actions/setup-java
      - name: ☕️ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # https://github.com/gradle/actions
      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ⚙️ Build with Gradle
        run: ./gradlew build

      - name: 🔎 Read project version
        id: gradle-version
        run: echo "version=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      # https://github.com/actions/upload-artifact
      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs

      - name: 🚀 Upload Nightly Build
        uses: djnicholson/release-action@v2.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-name: 'Nightly'
          tag-name: 'nightly'
          asset-name: 'spring-boot-kisses-angular-${{ steps.gradle-version.outputs.version }}-nightly.jar'
          file: './build/libs/spring-boot-kisses-angular-${{ steps.gradle-version.outputs.version }}.jar'
