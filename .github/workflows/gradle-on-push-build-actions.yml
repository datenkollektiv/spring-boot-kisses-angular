name: Java CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Every action is pinned to a full-length commit SHA (see AGENTS.md "Key Conventions").
      # Dependabot bumps these weekly and rewrites the trailing version comment.

      # https://github.com/actions/checkout
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/actions/setup-java
      - name: ☕️ Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # https://github.com/gradle/actions
      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ⚙️ Build with Gradle
        run: ./gradlew build

      # https://github.com/actions/upload-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Package
          path: build/libs
