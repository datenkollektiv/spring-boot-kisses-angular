plugins {
    id 'org.springframework.boot' version '2.6.7'

    // https://plugins.gradle.org/search?term=com.github.node-gradle.node
    id "com.github.node-gradle.node" version "3.2.1"

    // https://plugins.gradle.org/search?term=com.google.cloud.tools.jib
    id "com.google.cloud.tools.jib" version "3.1.4"
}

apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'

version = '0.5.14'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }

    archivesBaseName = 'spring-boot-kisses-angular'
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web")
}

def generatedResources = "src/generated/resources"

sourceSets {
    main {
        output.dir(generatedResources, builtBy: 'ngBuild')
    }
}

node {
    // https://nodejs.org/en/about/releases/
    version = '16.20.0'
    download = true
}

tasks.register('npmAudit', NpmTask) {
    dependsOn(npmInstall)
    args = ['audit']
}

tasks.register('npmAuditFix', NpmTask) {
    dependsOn(npmInstall)
    args = ['audit', 'fix']
}

tasks.register('ngBuild', NpxTask) {
    dependsOn(npmInstall)
    command = '@angular/cli'
    args = ['build', '--configuration', 'production']
}

tasks.register('ngServeProduction', NpxTask) {
    dependsOn('ngBuild')
    command = '@angular/cli'
    args = ['serve', '--open', '--configuration=production' ]
}

tasks.register('ngUpdate', NpxTask) {
    dependsOn('npmInstall')
    command = '@angular/cli'
    args = ['update', '@angular/core@14', '@angular/cli@14']
}

processResources.dependsOn 'ngBuild'

jibDockerBuild.dependsOn 'processResources'

jib {
    if (System.properties['platform.architecture'] == 'arm64') {
        from {
            platforms {
                platform {
                    architecture = 'arm64'
                    os = 'linux'
                }
            }
        }
    }
    to {
        image = 'datenkollektiv/spring-boot-kisses-angular'
        if (System.properties['platform.architecture'] == 'arm64') {
            tags = ['latest.arm64', project.version + '.arm64'] as List<String>
        } else {
            tags = ['latest', project.version] as List<String>
        }
    }
    container {
        appRoot = '/app'
        ports = ['8080']
        workingDirectory = '/app'
    }
    extraDirectories {
        paths {
            path {
                from = file(generatedResources)
                into = '/app'
            }
        }
    }
}

clean.delete << file('node_modules')
clean.delete << file(generatedResources)
