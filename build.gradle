plugins {
    // https://plugins.gradle.org/plugin/io.spring.dependency-management
    id 'io.spring.dependency-management' version '1.1.7'

    // https://plugins.gradle.org/plugin/org.springframework.boot
    id 'org.springframework.boot' version '4.0.5'

    // https://plugins.gradle.org/plugin/com.github.node-gradle.node
    id "com.github.node-gradle.node" version "7.1.0"

    // https://plugins.gradle.org/plugin/com.google.cloud.tools.jib
    id "com.google.cloud.tools.jib" version "3.5.3"

    // https://plugins.gradle.org/plugin/org.owasp.dependencycheck
    id "org.owasp.dependencycheck" version "12.2.1"
}

apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'

version = '0.6.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base {
    archivesName = 'spring-boot-kisses-angular'
}

tasks.test {
    useJUnitPlatform {
    }
}

springBoot {
    mainClass = 'de.datenkollektiv.examples.springframework.boot.angular.AngularApplication'
    buildInfo()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web")

    testImplementation(platform('org.junit:junit-bom:6.0.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation('org.springframework.boot:spring-boot-restclient')
    testImplementation('org.springframework.boot:spring-boot-resttestclient')
}

def generatedResources = "src/generated/resources"

sourceSets {
    main {
        output.dir(generatedResources, builtBy: 'ngBuild')
    }
}

node {
    // https://nodejs.org/en/docs
    version = '24.14.1'
    download = true
}

tasks.register('npmAudit', NpmTask) {
    dependsOn(npmInstall)
    args = ['audit', '--omit=dev']
}

tasks.register('npmAuditFix', NpmTask) {
    dependsOn(npmInstall)
    args = ['audit', 'fix']
}

tasks.register('ngBuild', NpxTask) {
    dependsOn(npmInstall)
    command = '@angular/cli'
    args = ['build', '--configuration', 'production']
}

tasks.register('ngServeProduction', NpxTask) {
    dependsOn('ngBuild')
    command = '@angular/cli'
    args = ['serve', '--open', '--configuration=production' ]
}

tasks.register('ngUpdate', NpxTask) {
    dependsOn('npmInstall')
    command = '@angular/cli'
    args = ['update', '@angular/core@21', '@angular/cli@21']
}

processResources.dependsOn 'ngBuild'

jibDockerBuild.dependsOn 'processResources'

jib {
    if (System.properties['platform.architecture'] == 'arm64') {
        from {
            platforms {
                platform {
                    architecture = 'arm64'
                    os = 'linux'
                }
            }
        }
    }
    to {
        image = 'datenkollektiv/spring-boot-kisses-angular'
        if (System.properties['platform.architecture'] == 'arm64') {
            tags = ['latest.arm64', project.version + '.arm64'] as List<String>
        } else {
            tags = ['latest', project.version] as List<String>
        }
    }
    container {
        appRoot = '/app'
        ports = ['8080']
        workingDirectory = '/app'
    }
    extraDirectories {
        paths {
            path {
                from = file(generatedResources)
                into = '/app/resources'
            }
        }
    }
}

dependencyCheck {
    formats = ['JSON', 'HTML']
    suppressionFile = 'owasp-suppressions.xml'
    scanConfigurations = ['runtimeClasspath']
    analyzers {
        assemblyEnabled = false
        centralEnabled = false
        nodeAuditEnabled = false
        archiveEnabled = false
        jarEnabled = true
        kev {
            enabled = false
        }
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
        validForHours = 24
        delay = 2000
    }
}

clean.delete << file('node_modules')
clean.delete << file(generatedResources)
